<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Plated: Recipe Sharing</title>
   <link rel="stylesheet" href="styles.css">
   <script src="javascripts/index.js"></script>
   <script src="javascripts/utils.js"></script>
</head>
<body>
   <header>
       <h1>Recipe Sharing </h1>
       <!-- <a href="/users/">Get your user info</a><br>
       <a href="/signin">Login</a><br>
       <a href="/signout">Logout</a>
       <a href="/user/register">Sign Up</a> -->
   </header>
   <main>
       <section>
           <h2>Welcome to Plated!</h2>
           <p>Discover and share recipes.</p>
       </section>
       <div id="make_post_div" class="d-none">
           <h2>Post your recipe:</h2>
           <p>Enter the title of your recipe:</p>
           <input type="text" id="titleInput" />
           <p>Enter a summary of your recipe:</p>
           <input type="text" id="summaryInput" />
           <p>Enter ingredients:</p>
           <input type="text" id="ingredientsInput" />
           <p>Enter cooking instructions:</p>
           <textarea id="instructionsInput"></textarea>
           <button onclick="postRecipe()">Post</button> <span id="postStatus"></span>
           <div id="recipeList"></div>
       </div>
   </main>
   <footer>
       <p>&copy; 2025 Plated. All rights reserved.</p>
   </footer>
</body>
</html>
